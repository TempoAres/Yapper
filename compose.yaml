services:
  database:
    image: postgres:17-alpine
    container_name: yapper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yapper
      POSTGRES_USER: yapper
      POSTGRES_PASSWORD: change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yapper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapper -d yapper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yapper_postgres_data:
